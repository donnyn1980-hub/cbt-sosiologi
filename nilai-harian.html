<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Nilai Sosiologi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Login Section */
        .login-section {
            display: block;
        }

        .login-section.hidden {
            display: none;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header .subtitle {
            color: #666;
            font-size: 14px;
        }

        .login-header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Dashboard Section */
        .dashboard-section {
            display: none;
        }

        .dashboard-section.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-info h2 {
            color: #333;
            font-size: 24px;
        }

        .user-info .detail {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .section-title {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .materi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .materi-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .materi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .materi-card .materi-title {
            font-weight: 600;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .materi-card .materi-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .materi-card .materi-desc {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .materi-card.empty {
            border-left-color: #ddd;
            opacity: 0.6;
        }

        .materi-card.empty .materi-value {
            color: #999;
            font-size: 18px;
        }

        .materi-card .nilai-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }

        .nilai-badge.baik {
            background: #4caf50;
            color: white;
        }

        .nilai-badge.sedang {
            background: #ff9800;
            color: white;
        }

        .nilai-badge.kurang {
            background: #f44336;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .materi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Section -->
    <div id="loginSection" class="login-section">
        <div class="login-header">
            <div class="icon">📚</div>
            <h1>Sistem Nilai Sosiologi</h1>
            <p class="subtitle">Masukkan NIS dan Password untuk melihat nilai Anda</p>
        </div>

        <div id="loginError" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="nisInput">NIS (Username)</label>
                <input 
                    type="text" 
                    id="nisInput" 
                    placeholder="Contoh: 2024001" 
                    required
                    autocomplete="username"
                >
            </div>
            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Masukkan password" 
                    required
                    autocomplete="current-password"
                >
            </div>
            <button type="submit" class="btn" id="loginBtn">
                <span id="loginBtnText">Login</span>
                <span id="loginBtnLoading" style="display: none;">Loading...</span>
            </button>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard-section">
        <div class="dashboard-header">
            <div class="user-info">
                <h2 id="studentName">-</h2>
                <div class="detail" id="studentInfo">NIS: - | Kelas: -</div>
            </div>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalMateri">0</div>
                <div class="label">Total Materi</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalNilai">0</div>
                <div class="label">Total Nilai</div>
            </div>
            <div class="stat-card">
                <div class="number" id="rataRata">0</div>
                <div class="label">Rata-rata</div>
            </div>
        </div>

        <h3 class="section-title">📋 Daftar Materi & Nilai</h3>
        <div id="materiGrid" class="materi-grid">
            <!-- Akan diisi oleh JavaScript -->
        </div>
    </div>
</div>

<script>
// ============================================
// KONFIGURASI API - UPDATE URL WORKER ANDA
// ============================================
const API_BASE_URL = 'https://nilai-sosiologi.donnyn1980.workers.dev';

// ============================================
// DOM ELEMENTS
// ============================================
const loginSection = document.getElementById('loginSection');
const dashboardSection = document.getElementById('dashboardSection');
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const loginBtnText = document.getElementById('loginBtnText');
const loginBtnLoading = document.getElementById('loginBtnLoading');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');
const studentName = document.getElementById('studentName');
const studentInfo = document.getElementById('studentInfo');
const totalMateri = document.getElementById('totalMateri');
const totalNilai = document.getElementById('totalNilai');
const rataRata = document.getElementById('rataRata');
const materiGrid = document.getElementById('materiGrid');

// ============================================
// STATE
// ============================================
let currentUser = null;

// ============================================
// UTILITY FUNCTIONS
// ============================================
function showError(message) {
    loginError.textContent = message;
    loginError.classList.add('show');
    setTimeout(() => {
        loginError.classList.remove('show');
    }, 5000);
}

function getMateriLabel(index) {
    const labels = [
        '📖 Materi 1', '📖 Materi 2', '📖 Materi 3', '📖 Materi 4', '📖 Materi 5',
        '📖 Materi 6', '📖 Materi 7', '📖 Materi 8', '📖 Materi 9'
    ];
    return labels[index - 1] || `Materi ${index}`;
}

function getNilaiBadge(nilai) {
    const num = parseFloat(nilai);
    if (isNaN(num)) return '';
    if (num >= 80) return '<span class="nilai-badge baik">✅ Baik</span>';
    if (num >= 60) return '<span class="nilai-badge sedang">📊 Sedang</span>';
    return '<span class="nilai-badge kurang">📉 Kurang</span>';
}

function getNilaiColor(nilai) {
    const num = parseFloat(nilai);
    if (isNaN(num)) return '#999';
    if (num >= 80) return '#4caf50';
    if (num >= 60) return '#ff9800';
    return '#f44336';
}

// ============================================
// API FUNCTIONS
// ============================================
async function login(nis, password) {
    const response = await fetch(`${API_BASE_URL}/api/login`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ nis, password }),
    });

    if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Login gagal');
    }

    return await response.json();
}

async function getStudentData(nis, password) {
    const response = await fetch(
        `${API_BASE_URL}/api/student?nis=${encodeURIComponent(nis)}&password=${encodeURIComponent(password)}`
    );

    if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error || 'Gagal mengambil data');
    }

    return await response.json();
}

// ============================================
// RENDER FUNCTIONS
// ============================================
function renderDashboard(data) {
    const student = data.data;
    currentUser = student;

    // User info
    studentName.textContent = student.nama || 'Nama tidak tersedia';
    studentInfo.textContent = `NIS: ${student.nis || '-'} | Kelas: ${student.kelas || '-'}`;

    // Process materi data
    const materiList = [];
    let totalMateriCount = 0;
    let sumNilai = 0;

    for (let i = 1; i <= 9; i++) {
        const materiKey = `m${i}`;
        const nilaiKey = i.toString();
        
        const materi = student[materiKey] || '';
        const nilai = student[nilaiKey];

        const isFilled = materi !== '' && nilai !== null && nilai !== '';
        const nilaiNum = isFilled ? parseFloat(nilai) : null;

        materiList.push({
            index: i,
            label: getMateriLabel(i),
            materi: materi,
            nilai: nilai,
            isFilled: isFilled,
            nilaiNum: nilaiNum
        });

        if (isFilled && nilaiNum !== null && !isNaN(nilaiNum)) {
            totalMateriCount++;
            sumNilai += nilaiNum;
        }
    }

    // Update stats
    totalMateri.textContent = totalMateriCount;
    totalNilai.textContent = sumNilai.toFixed(1);
    const avg = totalMateriCount > 0 ? (sumNilai / totalMateriCount).toFixed(1) : '0';
    rataRata.textContent = avg;

    // Render materi cards
    materiGrid.innerHTML = '';
    materiList.forEach(item => {
        const card = document.createElement('div');
        card.className = `materi-card${!item.isFilled ? ' empty' : ''}`;

        const nilaiDisplay = item.isFilled ? item.nilai : '—';
        const nilaiColor = item.isFilled ? getNilaiColor(item.nilai) : '#999';
        const badge = item.isFilled ? getNilaiBadge(item.nilai) : '';

        card.innerHTML = `
            <div class="materi-title">${item.label}</div>
            <div class="materi-value" style="color: ${nilaiColor}">
                ${nilaiDisplay}
            </div>
            <div class="materi-desc">
                ${item.isFilled ? `📝 ${item.materi}` : 'Belum ada materi'}
            </div>
            ${badge}
        `;

        materiGrid.appendChild(card);
    });
}

// ============================================
// EVENT HANDLERS
// ============================================
async function handleLogin(e) {
    e.preventDefault();

    const nis = document.getElementById('nisInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();

    if (!nis || !password) {
        showError('⚠️ NIS dan Password harus diisi!');
        return;
    }

    // Show loading state
    loginBtn.disabled = true;
    loginBtnText.style.display = 'none';
    loginBtnLoading.style.display = 'inline';

    try {
        // Login
        const loginResult = await login(nis, password);
        
        if (!loginResult.success) {
            throw new Error(loginResult.error || 'Login gagal');
        }

        // Get student data
        const studentData = await getStudentData(nis, password);

        if (!studentData.success) {
            throw new Error(studentData.error || 'Gagal mengambil data siswa');
        }

        // Show dashboard
        loginSection.classList.add('hidden');
        dashboardSection.classList.add('active');
        renderDashboard(studentData);

        // Reset form
        loginForm.reset();
        loginError.classList.remove('show');

    } catch (error) {
        console.error('Login error:', error);
        showError(`❌ ${error.message || 'Terjadi kesalahan saat login'}`);
    } finally {
        // Hide loading state
        loginBtn.disabled = false;
        loginBtnText.style.display = 'inline';
        loginBtnLoading.style.display = 'none';
    }
}

function handleLogout() {
    dashboardSection.classList.remove('active');
    loginSection.classList.remove('hidden');
    currentUser = null;
    materiGrid.innerHTML = '';
    
    // Reset stats
    totalMateri.textContent = '0';
    totalNilai.textContent = '0';
    rataRata.textContent = '0';
    
    // Reset form
    loginForm.reset();
    loginError.classList.remove('show');
}

// ============================================
// EVENT LISTENERS
// ============================================
loginForm.addEventListener('submit', handleLogin);
logoutBtn.addEventListener('click', handleLogout);

// Enter key support
document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        loginForm.dispatchEvent(new Event('submit'));
    }
});

// ============================================
// INIT
// ============================================
console.log('🚀 Sistem Nilai Sosiologi siap digunakan!');
console.log(`📡 API URL: ${API_BASE_URL}`);
console.log('💡 Gunakan NIS dan Password untuk login');
</script>

</body>
</html>
