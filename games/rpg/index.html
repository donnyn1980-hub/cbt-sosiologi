<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Raja Monster — Pertarungan Terakhir</title>
<style>
/* ============================================================
   PORTRAIT MOBILE-FIRST STYLE
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: 
    radial-gradient(ellipse 60% 30% at 50% -5%, rgba(138,35,51,0.15), transparent),
    radial-gradient(ellipse 40% 25% at 90% 100%, rgba(79,184,165,0.05), transparent),
    #0c0714;
  color: #ece3d0;
  font-family: 'Spectral', serif;
  padding: 6px 4px 70px;
  display: flex;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}

/* Root Variables */
:root {
  --void: #0c0714;
  --surface: #1b1027;
  --surface-2: #241536;
  --parchment: #ece3d0;
  --parchment-dim: #b8ac93;
  --gold: #cfa438;
  --gold-bright: #f0cf6e;
  --blood: #8a2333;
  --blood-bright: #d64858;
  --mist: #4fb8a5;
  --mist-bright: #6fe0cb;
  --line: rgba(207,164,56,0.15);
  --radius: 10px;
  --radius-sm: 6px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

#app { 
  width: 100%; 
  max-width: 420px; 
  margin: 0 auto;
  padding: 0 2px;
}

/* ============================================================
   ANTI-CHEAT OVERLAY
   ============================================================ */
#blocker-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: rgba(0,0,0,0.95);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}
#blocker-overlay.show { display: flex; }
#blocker-overlay .big-icon { font-size: 40px; margin-bottom: 10px; }
#blocker-overlay h2 {
  color: var(--blood-bright);
  font-family: 'Cinzel', serif;
  font-size: 16px;
  margin-bottom: 6px;
}
#blocker-overlay p {
  color: var(--parchment-dim);
  font-size: 13px;
  max-width: 280px;
  line-height: 1.5;
}

/* ============================================================
   WARNING MESSAGE
   ============================================================ */
.warning-msg {
  position: fixed;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blood);
  color: white;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  z-index: 99998;
  display: none;
  animation: slideDown 0.3s ease;
  border: 1.5px solid var(--blood-bright);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  max-width: 94%;
  text-align: center;
  line-height: 1.3;
}
.warning-msg.show { display: block; }
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-15px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ============================================================
   TITLE - COMPACT
   ============================================================ */
.title-block { 
  text-align: center; 
  margin-bottom: 8px; 
  padding: 0 2px;
}
.title-block .eyebrow { 
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.5;
  margin-bottom: 2px;
}
.title-crown { 
  width: 28px; 
  height: 28px; 
  margin: 0 auto 1px; 
  display: block; 
}
.title-block h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(16px, 4.5vw, 22px);
  color: var(--gold-bright);
  text-shadow: 0 0 12px rgba(240,207,110,0.2), 0 2px 0 rgba(0,0,0,0.4);
  line-height: 1.1;
  letter-spacing: 0.02em;
}
.title-block p { 
  color: var(--parchment-dim); 
  font-size: 9px; 
  margin-top: 1px; 
  padding: 0 4px;
  opacity: 0.5;
  display: none;
}

/* ============================================================
   PANELS - ULTRA COMPACT
   ============================================================ */
.panel {
  background: linear-gradient(180deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  margin-bottom: 6px;
}

/* ============================================================
   SETUP SCREEN
   ============================================================ */
.step-label { 
  font-family: 'Cinzel', serif; 
  font-size: 10px; 
  color: var(--gold-bright); 
  margin-bottom: 5px; 
  letter-spacing: 0.03em;
  opacity: 0.8;
}
.count-row { 
  display: grid; 
  grid-template-columns: repeat(4, 1fr); 
  gap: 4px; 
}
#level-row.count-row { 
  grid-template-columns: repeat(4, 1fr); 
}
.count-btn {
  padding: 7px 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--void);
  color: var(--parchment);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.12s ease;
  touch-action: manipulation;
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.count-btn:active { transform: scale(0.94); }
.count-btn.active {
  background: linear-gradient(180deg, var(--gold), #a8801f);
  color: #241100;
  border-color: var(--gold-bright);
}

.name-fields { 
  margin-top: 6px; 
  display: flex; 
  flex-direction: column; 
  gap: 5px; 
}
.name-field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--parchment-dim);
  margin-bottom: 1px;
  opacity: 0.5;
}
.name-field input {
  width: 100%;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--void);
  color: var(--parchment);
  font-family: 'Spectral', serif;
  font-size: 13px;
  -webkit-appearance: none;
  appearance: none;
  min-height: 32px;
}
.name-field input:focus { 
  outline: none; 
  border-color: var(--gold); 
}

/* ============================================================
   BUTTONS - COMPACT
   ============================================================ */
.btn {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.03em;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: #241100;
  cursor: pointer;
  transition: all 0.12s ease;
  touch-action: manipulation;
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  width: 100%;
  font-weight: 600;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.btn.ghost {
  background: transparent;
  color: var(--parchment);
  border: 1px solid var(--line);
}
.btn.blood {
  background: linear-gradient(180deg, var(--blood-bright), var(--blood));
  border-color: var(--blood-bright);
  color: #2a0208;
}
.btn.mist {
  background: linear-gradient(180deg, var(--mist-bright), var(--mist));
  border-color: var(--mist-bright);
  color: #052422;
}
.btn-row { 
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
}
.btn-row .btn { width: 100%; }

.err { 
  color: var(--blood-bright);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 4px;
  min-height: 10px;
  text-align: center;
}

/* ============================================================
   BATTLE SCREEN - COMPACT
   ============================================================ */
.round-banner {
  text-align: center;
  margin-bottom: 4px;
}
.round-banner .eyebrow { 
  font-size: 8px;
  opacity: 0.4;
  margin-bottom: 0;
}
.round-banner h2 { 
  font-size: 13px;
  color: var(--parchment);
  font-weight: 600;
  line-height: 1.2;
}

/* Monster Card - Compact */
.monster-card {
  padding: 6px 4px;
  text-align: center;
}
.monster-svg { 
  width: 56px;
  height: 56px;
  margin: 0 auto 1px;
  display: block;
  filter: drop-shadow(0 0 10px rgba(214,72,88,0.3));
}
.monster-svg.hit { animation: shake .3s ease; }
@keyframes shake {
  10%,90% { transform: translate3d(-2px,0,0); }
  30%,70% { transform: translate3d(3px,0,0); }
  50% { transform: translate3d(-4px,0,0); }
}
.monster-card h2 { 
  font-size: 14px;
  color: var(--blood-bright);
  text-shadow: 0 0 10px rgba(214,72,88,0.25);
  line-height: 1.1;
}
.monster-card h2 span { font-size: 8px; }

.bar-track {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.04);
  overflow: hidden;
  margin-top: 4px;
}
.bar-fill { height: 100%; border-radius: 3px; transition: width .35s ease; }
.bar-fill.blood { background: linear-gradient(90deg, var(--blood), var(--blood-bright)); }
.bar-fill.mist { background: linear-gradient(90deg, var(--mist), var(--mist-bright)); }

.monster-stats { 
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
}
.stat-chip { color: var(--parchment-dim); opacity: 0.6; }
.stat-chip b { display: block; font-size: 12px; color: var(--parchment); }

/* Players Grid - Compact */
.players-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.player-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 5px 4px;
  transition: all .25s ease;
}
.player-card.turn { 
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 1px var(--gold-bright), 0 0 10px rgba(240,207,110,0.12);
}
.player-card.dead { opacity: 0.25; }
.player-card .pname { 
  font-family: 'Cinzel', serif;
  font-size: 9px;
  color: var(--gold-bright);
  margin-bottom: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.player-card .pname .tag { 
  font-family: 'JetBrains Mono', monospace;
  font-size: 6px;
  color: var(--parchment-dim);
  opacity: 0.4;
}
.player-card .bar-track { height: 4px; margin-top: 2px; }
.player-card .pstats { 
  font-family: 'JetBrains Mono', monospace;
  font-size: 7px;
  color: var(--parchment-dim);
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  opacity: 0.5;
}

/* ============================================================
   ACTION PANEL - COMPACT
   ============================================================ */
.action-panel { padding: 6px 4px; }
.action-panel h3 { 
  font-size: 11px;
  color: var(--gold-bright);
  margin-bottom: 1px;
}
.action-panel .sub { 
  color: var(--parchment-dim);
  font-size: 9px;
  margin-bottom: 6px;
  line-height: 1.3;
  opacity: 0.6;
}

.choice-group { margin-bottom: 6px; }
.choice-group .glabel { 
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--parchment-dim);
  margin-bottom: 3px;
  display: block;
  opacity: 0.5;
}
.choice-row { 
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
}
.choice-btn {
  padding: 6px 2px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--void);
  color: var(--parchment);
  font-family: 'Cinzel', serif;
  font-size: 9px;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s ease;
  touch-action: manipulation;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1.2;
}
.choice-btn:active { transform: scale(0.95); }
.choice-btn.selected { 
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: #241100;
  border-color: var(--gold-bright);
}
#mult-row .choice-btn { grid-column: span 1; }

.question-box {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
}
.question-box .qtext { 
  font-size: 12px;
  color: var(--parchment);
  margin-bottom: 6px;
  line-height: 1.4;
}

/* ============================================================
   SEDERHANA - COMPACT
   ============================================================ */
.qopt-wrapper {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  margin: 3px 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all 0.12s ease;
  touch-action: manipulation;
  min-height: 32px;
}
.qopt-wrapper:active { transform: scale(0.97); }
.qopt-wrapper input[type="radio"] {
  accent-color: var(--gold);
  width: 14px;
  height: 14px;
  cursor: pointer;
  flex-shrink: 0;
}
.qopt-wrapper label { 
  color: var(--parchment);
  font-size: 11px;
  cursor: pointer;
  flex: 1;
  line-height: 1.2;
}

/* ============================================================
   KATEGORI - COMPACT
   ============================================================ */
.kategori-table {
  width: 100%;
  border-collapse: collapse;
  margin: 4px 0;
  font-size: 9px;
  background: rgba(12,7,20,0.3);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.kategori-table th {
  background: rgba(207,164,56,0.1);
  color: var(--gold-bright);
  padding: 4px 1px;
  text-align: center;
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 7px;
  letter-spacing: 0.03em;
  opacity: 0.7;
}
.kategori-table td {
  padding: 3px 1px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.kategori-table .pernyataan-cell {
  text-align: left;
  color: var(--parchment);
  padding-right: 3px;
  font-size: 8px;
  line-height: 1.2;
}
.kategori-table .kategori-cell {
  text-align: center;
  width: 28px;
  padding: 1px;
}
.kategori-table .kategori-cell input[type="radio"] {
  appearance: none;
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border: 1.5px solid #7f6552;
  border-radius: 50%;
  outline: none;
  background: transparent;
  cursor: pointer;
  transition: all 0.12s ease;
}
.kategori-table .kategori-cell input[type="radio"]:checked {
  border: 3.5px solid var(--gold);
  background: var(--gold);
  box-shadow: 0 0 6px rgba(207,164,56,0.25);
}
.kategori-table .kategori-label {
  font-size: 7px;
  cursor: pointer;
  color: var(--parchment-dim);
}
.kategori-confirm-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
}
.kategori-confirm-btn { max-width: 200px; }
.kategori-hint {
  font-size: 8px;
  color: var(--parchment-dim);
  font-style: italic;
  text-align: center;
  opacity: 0.5;
}

/* ============================================================
   MCMA - COMPACT
   ============================================================ */
.mcma-grid {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin: 4px 0;
}
.mcma-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  background: rgba(12,7,20,0.3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  transition: all 0.12s ease;
  cursor: pointer;
  touch-action: manipulation;
  min-height: 30px;
}
.mcma-item:active { transform: scale(0.97); }
.mcma-item input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border: 1.5px solid #7f6552;
  border-radius: 3px;
  outline: none;
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.12s ease;
  position: relative;
}
.mcma-item input[type="checkbox"]:checked {
  background: var(--gold);
  border-color: var(--gold);
}
.mcma-item input[type="checkbox"]:checked::after {
  content: '✓';
  color: #241100;
  font-size: 9px;
  font-weight: bold;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.mcma-item label {
  color: var(--parchment);
  font-size: 10px;
  cursor: pointer;
  flex: 1;
  line-height: 1.2;
}
.mcma-item .mcma-huruf {
  font-weight: 700;
  color: var(--gold);
  background: rgba(207,164,56,0.1);
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 8px;
  font-family: 'Cinzel', serif;
  flex-shrink: 0;
}
.mcma-confirm-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
}
.mcma-confirm-btn { max-width: 200px; }
.mcma-hint {
  font-size: 8px;
  color: var(--parchment-dim);
  font-style: italic;
  text-align: center;
  opacity: 0.5;
}

/* ============================================================
   RESULT - COMPACT
   ============================================================ */
.result-msg { 
  margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  line-height: 1.3;
}
.result-msg.win { 
  background: rgba(79,184,165,0.08);
  color: var(--mist-bright);
  border: 1px solid rgba(79,184,165,0.15);
}
.result-msg.lose { 
  background: rgba(138,35,51,0.1);
  color: var(--blood-bright);
  border: 1px solid rgba(138,35,51,0.2);
}

/* ============================================================
   LOG - COMPACT
   ============================================================ */
.log-panel { padding: 6px 4px; }
.log-panel h3 { 
  font-size: 8px;
  color: var(--parchment-dim);
  margin-bottom: 3px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  opacity: 0.4;
}
.log-list { 
  max-height: 80px;
  overflow-y: auto;
  display: flex;
  flex-direction: column-reverse;
  gap: 2px;
  padding-right: 2px;
}
.log-item { 
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  color: var(--parchment-dim);
  border-left: 1.5px solid var(--line);
  padding: 1px 0 1px 4px;
  line-height: 1.2;
  opacity: 0.6;
}
.log-item b { color: var(--parchment); }
.log-item.hit-monster { border-left-color: var(--ember); }
.log-item.hit-player { border-left-color: var(--blood-bright); }
.log-item.boost { border-left-color: var(--gold); }
.log-item.fail { border-left-color: var(--parchment-dim); opacity: 0.3; }

/* ============================================================
   END SCREEN - COMPACT
   ============================================================ */
.end-panel { text-align: center; padding: 16px 8px; }
.end-panel .big-icon { width: 44px; height: 44px; margin: 0 auto 6px; }
.end-panel h2 { font-size: 17px; margin-bottom: 3px; }
.end-panel p { 
  color: var(--parchment-dim);
  font-size: 11px;
  margin-bottom: 10px;
  line-height: 1.4;
  opacity: 0.6;
}

.hidden { display: none !important; }

/* ============================================================
   SCROLLBAR
   ============================================================ */
.log-list::-webkit-scrollbar { width: 2px; }
.log-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 2px; }
.log-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

/* ============================================================
   LANDSCAPE WARNING
   ============================================================ */
@media (orientation: landscape) and (max-height: 500px) {
  body { padding: 4px 4px 50px; }
  .title-block { display: none; }
  .monster-svg { width: 40px; height: 40px; }
  .players-grid { grid-template-columns: repeat(4, 1fr); }
  .log-list { max-height: 50px; }
}

/* ============================================================
   PRINT PROTECTION
   ============================================================ */
@media print {
  body * { visibility: hidden; }
  body::before {
    content: "🚫 Dilarang mencetak!";
    visibility: visible;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 700;
    color: var(--blood-bright);
    background: var(--void);
    padding: 16px 24px;
    border-radius: 10px;
    border: 3px solid var(--blood-bright);
    z-index: 99999;
    text-align: center;
    width: 90%;
    max-width: 300px;
  }
}

/* ============================================================
   TABLET & LARGER SCREENS
   ============================================================ */
@media (min-width: 600px) {
  body { padding: 12px 16px 60px; }
  #app { max-width: 600px; }
  .panel { padding: 14px 12px; }
  .title-block p { display: block; }
  .count-btn { font-size: 15px; min-height: 40px; }
  .players-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
  .monster-svg { width: 70px; height: 70px; }
  .log-list { max-height: 100px; }
}

@media (min-width: 900px) {
  body { padding: 20px 24px 60px; }
  #app { max-width: 780px; }

  .players-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .monster-svg { width: 90px; height: 90px; }
  .count-row { grid-template-columns: repeat(4, 1fr); }

/* ============================================================

  }
}

<!-- ============================================================
   MAIN APP

<div id="app">

  <div class="title-block">

    <svg class="title-crown" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M50 8 L60 22 L72 10 L70 28 L88 26 L74 40 Q90 46 88 62 Q86 82 50 90 Q14 82 12 62 Q10 46 26 40 L12 26 L30 28 L28 10 L40 22 Z" fill="#5c1420" stroke="#d64858" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="38" cy="52" r="5" fill="#f0cf6e"/>

<script src="soal-bank.js"></script>
<script>
(function(){

/* ============================================================
   ANTI-CHEAT SYSTEM
   ============================================================ */

const blocker = document.getElementById('blocker-overlay');
const warningMsg = document.getElementById('warningMsg');
let warningTimeout = null;

function showWarning(text, isError = true) {
  warningMsg.textContent = text;
  warningMsg.style.background = isError ? 'var(--blood)' : 'var(--gold)';
  warningMsg.style.color = isError ? 'white' : 'var(--void)';
  warningMsg.className = 'warning-msg show';
  clearTimeout(warningTimeout);
  warningTimeout = setTimeout(() => {
    warningMsg.className = 'warning-msg';
  }, 2500);
}

// Blokir Klik Kanan
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  showWarning('⚠️ Klik kanan tidak diizinkan!');
  return false;
});

// Blokir Keyboard Shortcuts
document.addEventListener('keydown', function(e) {
  const key = e.key;
  const ctrl = e.ctrlKey || e.metaKey;
  const shift = e.shiftKey;

  if (key === 'F12') {
    e.preventDefault();
    showWarning('⚠️ Developer tools tidak diizinkan!');
    return false;
  }

  if (ctrl && shift && (key === 'I' || key === 'J' || key === 'C')) {
    e.preventDefault();
    showWarning('⚠️ Developer tools tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 'u' || key === 'U')) {
    e.preventDefault();
    showWarning('⚠️ View source tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 'p' || key === 'P')) {
    e.preventDefault();
    showWarning('⚠️ Mencetak tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 's' || key === 'S')) {
    e.preventDefault();
    showWarning('⚠️ Menyimpan halaman tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 'c' || key === 'C')) {
    e.preventDefault();
    showWarning('⚠️ Menyalin teks tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 'x' || key === 'X')) {
    e.preventDefault();
    showWarning('⚠️ Memotong teks tidak diizinkan!');
    return false;
  }

  if (ctrl && (key === 'v' || key === 'V')) {
    e.preventDefault();
    showWarning('⚠️ Menempel teks tidak diizinkan!');
    return false;
  }

  return true;
});

// Blokir Copy, Cut, Paste, Drag
document.addEventListener('copy', function(e) { e.preventDefault(); showWarning('⚠️ Copy tidak diizinkan!'); });
document.addEventListener('cut', function(e) { e.preventDefault(); showWarning('⚠️ Cut tidak diizinkan!'); });
document.addEventListener('paste', function(e) { e.preventDefault(); showWarning('⚠️ Paste tidak diizinkan!'); });
document.addEventListener('dragstart', function(e) { e.preventDefault(); showWarning('⚠️ Drag tidak diizinkan!'); });
document.addEventListener('selectstart', function(e) { e.preventDefault(); });

document.addEventListener('mousedown', function(e) {
  if (e.detail > 1) {
    e.preventDefault();
    showWarning('⚠️ Double click tidak diizinkan!');
  }
});

let isGameActive = false;

document.addEventListener('visibilitychange', function() {
  if (isGameActive && document.hidden) {
    showWarning('⚠️ Jangan pindah tab!');
  }
});

window.addEventListener('blur', function() {
  if (isGameActive) {
    showWarning('⚠️ Jangan keluar dari permainan!');
  }
});

/* ============================================================
   GAME STATE
   ============================================================ */
let monster = null;
let monsterMaxEnergy = 10000;
let players = [];
let round = 1;
let boostQueue = [];
let currentPlayerIdx = null;
let pendingChoice = null;
let selectedStat = null;
let selectedMult = null;

let usedSoalSederhana = new Set();
let usedSoalKategori = new Set();
let usedSoalMcma = new Set();

/* ============================================================
   DOM REFS
   ============================================================ */
const setupScreen = document.getElementById('setup-screen');
const gameScreen = document.getElementById('game-screen');
const endScreen = document.getElementById('end-screen');
const countRow = document.getElementById('count-row');
const nameSection = document.getElementById('name-section');
const nameFields = document.getElementById('name-fields');
const levelSection = document.getElementById('level-section');
const levelRow = document.getElementById('level-row');
const levelInfo = document.getElementById('level-info');
const startBtn = document.getElementById('start-btn');
const setupErr = document.getElementById('setup-err');

let numPlayers = 0;
let monsterLevel = null;

/* ============================================================
   FUNGSI BANK SOAL
   ============================================================ */
function getSoalSederhana() {
  if (usedSoalSederhana.size >= SOAL_SEDERHANA.length) usedSoalSederhana.clear();
  let idx;
  do { idx = Math.floor(Math.random() * SOAL_SEDERHANA.length); } 
  while (usedSoalSederhana.has(idx));
  usedSoalSederhana.add(idx);
  return { ...SOAL_SEDERHANA[idx], tipe: 'Sederhana', mult: 2 };
}

function getSoalKategori() {
  if (usedSoalKategori.size >= SOAL_KATEGORI.length) usedSoalKategori.clear();
  let idx;
  do { idx = Math.floor(Math.random() * SOAL_KATEGORI.length); } 
  while (usedSoalKategori.has(idx));
  usedSoalKategori.add(idx);
  return { ...SOAL_KATEGORI[idx], tipe: 'Kategori', mult: 3 };
}

function getSoalMcma() {
  if (usedSoalMcma.size >= SOAL_MCMA.length) usedSoalMcma.clear();
  let idx;
  do { idx = Math.floor(Math.random() * SOAL_MCMA.length); } 
  while (usedSoalMcma.has(idx));
  usedSoalMcma.add(idx);
  return { ...SOAL_MCMA[idx], tipe: 'MCMA', mult: 4 };
}

/* ============================================================
   LEVEL STATS
   ============================================================ */
function levelStats(lv){
  return { energy: 10000 * lv, attack: 20 + 10 * (lv - 1) };
}

/* ============================================================
   SETUP EVENTS
   ============================================================ */
levelRow.addEventListener('click', (e)=>{
  const btn = e.target.closest('.count-btn');
  if(!btn) return;
  monsterLevel = parseInt(btn.dataset.lv,10);
  [...levelRow.children].forEach(c=>c.classList.toggle('active', c===btn));
  const s = levelStats(monsterLevel);
  levelInfo.style.color = 'var(--parchment-dim)';
  levelInfo.textContent = `Level ${monsterLevel}: energi ${s.energy}, serang ${s.attack}`;
});

countRow.addEventListener('click', (e)=>{
  const btn = e.target.closest('.count-btn');
  if(!btn) return;
  numPlayers = parseInt(btn.dataset.n,10);
  [...countRow.children].forEach(c=>c.classList.toggle('active', c===btn));
  nameSection.classList.remove('hidden');
  levelSection.classList.remove('hidden');
  startBtn.classList.remove('hidden');
  nameFields.innerHTML = '';
  for(let i=0;i<numPlayers;i++){
    const div = document.createElement('div');
    div.className = 'name-field';
    div.innerHTML = `<label>Pemain ${i+1}</label><input type="text" maxlength="16" placeholder="Nama..." id="pname-${i}">`;
    nameFields.appendChild(div);
  }
  setupErr.textContent = '';
});

startBtn.addEventListener('click', ()=>{
  const names = [];
  for(let i=0;i<numPlayers;i++){
    const val = document.getElementById(`pname-${i}`).value.trim();
    if(!val){ setupErr.textContent = 'Isi semua nama!'; return; }
    names.push(val);
  }
  if(!monsterLevel){ setupErr.textContent = 'Pilih level!'; return; }
  setupErr.textContent = '';
  isGameActive = true;
  initGame(names);
});

document.getElementById('restart-btn').addEventListener('click', ()=>{
  isGameActive = false;
  endScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  [...countRow.children].forEach(c=>c.classList.remove('active'));
  [...levelRow.children].forEach(c=>c.classList.remove('active'));
  nameSection.classList.add('hidden');
  levelSection.classList.add('hidden');
  startBtn.classList.add('hidden');
  nameFields.innerHTML='';
  levelInfo.textContent='';
  monsterLevel = null;
  usedSoalSederhana.clear();
  usedSoalKategori.clear();
  usedSoalMcma.clear();
});

/* ============================================================
   INIT GAME
   ============================================================ */
function initGame(names){
  const s = levelStats(monsterLevel);
  monster = { energy: s.energy, attack: s.attack };
  monsterMaxEnergy = s.energy;
  players = names.map(n => ({ name:n, energy:100, attack:10, alive:true }));
  round = 1;
  usedSoalSederhana.clear();
  usedSoalKategori.clear();
  usedSoalMcma.clear();
  document.getElementById('log-list').innerHTML = '';

  setupScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');

  renderMonster();
  renderPlayers();
  log(`👹 Raja Monster (Level ${monsterLevel}) bangkit!`, 'boost');
  startRound();
}

/* ============================================================
   RENDER FUNCTIONS
   ============================================================ */
function renderMonster(){
  document.getElementById('monster-energy').textContent = Math.max(0,monster.energy);
  document.getElementById('monster-attack').textContent = monster.attack;
  const pct = Math.max(0, Math.min(100, (monster.energy/monsterMaxEnergy)*100));
  document.getElementById('monster-bar').style.width = pct + '%';
  document.getElementById('monster-level-tag').textContent = `— Level ${monsterLevel}`;
}

function renderPlayers(){
  const grid = document.getElementById('players-grid');
  grid.innerHTML = '';
  players.forEach((p, i)=>{
    const card = document.createElement('div');
    card.className = 'player-card' + (!p.alive ? ' dead' : '') + (i===currentPlayerIdx && p.alive ? ' turn' : '');
    card.innerHTML = `
      <div class="pname"><span>${escapeHtml(p.name)}</span><span class="tag">${p.alive ? '●' : '✕'}</span></div>
      <div class="bar-track"><div class="bar-fill mist" style="width:${Math.max(0,Math.min(100,p.energy))}%;"></div></div>
      <div class="pstats"><span>${Math.max(0,p.energy)}</span><span>⚔${p.attack}</span></div>
    `;
    grid.appendChild(card);
  });
}

function setPhaseLabel(text){
  document.getElementById('phase-label').textContent = text;
  document.getElementById('round-label').textContent = `RONDE ${round}`;
}

function log(msg, cls){
  const list = document.getElementById('log-list');
  const item = document.createElement('div');
  item.className = 'log-item' + (cls ? ' '+cls : '');
  item.innerHTML = msg;
  list.appendChild(item);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shakeMonster(){
  const svg = document.getElementById('monster-svg');
  svg.classList.remove('hit');
  void svg.offsetWidth;
  svg.classList.add('hit');
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function startRound(){
  boostQueue = players.map((p,i)=>i).filter(i=>players[i].alive);
  currentPlayerIdx = null;
  nextBoostTurn();
}

function nextBoostTurn(){
  if(boostQueue.length === 0){
    currentPlayerIdx = null;
    renderPlayers();
    runPlayerAttackPhase();
    return;
  }
  currentPlayerIdx = boostQueue.shift();
  selectedStat = null;
  selectedMult = null;
  renderPlayers();
  setPhaseLabel(`Giliran ${players[currentPlayerIdx].name}`);
  renderBoostChoice();
}

function renderBoostChoice(){
  const p = players[currentPlayerIdx];
  const panel = document.getElementById('action-panel');
  panel.innerHTML = `
    <h3>${escapeHtml(p.name)}, pilih strategi</h3>
    <div class="sub">Pilih stat & tipe soal</div>

    <div class="choice-group">
      <span class="glabel">⚡ Tingkatkan</span>
      <div class="choice-row" id="stat-row">
        <button class="choice-btn" data-stat="energy">⚡ Energi</button>
        <button class="choice-btn" data-stat="attack">🗡 Serang</button>
      </div>
    </div>

    <div class="choice-group">
      <span class="glabel">📚 Tipe Soal</span>
      <div class="choice-row" id="mult-row">
        <button class="choice-btn" data-mult="2">📝 ×2</button>
        <button class="choice-btn" data-mult="3">📊 ×3</button>
        <button class="choice-btn" data-mult="4">✅ ×4</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" id="confirm-choice-btn" disabled>→ Jawab Soal</button>
    </div>
  `;

  panel.querySelector('#stat-row').addEventListener('click', (e)=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    selectedStat = btn.dataset.stat;
    [...panel.querySelector('#stat-row').children].forEach(c=>c.classList.toggle('selected', c===btn));
    updateConfirmState();
  });
  panel.querySelector('#mult-row').addEventListener('click', (e)=>{
    const btn = e.target.closest('.choice-btn'); if(!btn) return;
    selectedMult = parseInt(btn.dataset.mult,10);
    [...panel.querySelector('#mult-row').children].forEach(c=>c.classList.toggle('selected', c===btn));
    updateConfirmState();
  });
  panel.querySelector('#confirm-choice-btn').addEventListener('click', ()=>{
    pendingChoice = { stat: selectedStat, mult: selectedMult };
    let soal;
    if (selectedMult === 2) soal = getSoalSederhana();
    else if (selectedMult === 3) soal = getSoalKategori();
    else soal = getSoalMcma();
    pendingChoice.soal = soal;
    renderQuestion();
  });

  function updateConfirmState(){
    panel.querySelector('#confirm-choice-btn').disabled = !(selectedStat && selectedMult);
  }
}

/* ============================================================
   RENDER PERTANYAAN
   ============================================================ */
function renderQuestion(){
  const p = players[currentPlayerIdx];
  const soal = pendingChoice.soal;
  const panel = document.getElementById('action-panel');
  const statLabel = pendingChoice.stat === 'energy' ? 'Energi' : 'Daya Serang';
  const tipeLabel = soal.tipe === 'Sederhana' ? '×2' :
                    soal.tipe === 'Kategori' ? '×3' : '×4';
  
  setPhaseLabel(`${p.name} — ${tipeLabel}`);

  let html = `
    <h3>Pertanyaan ${tipeLabel}</h3>
    <div class="sub">
      Benar → ${statLabel} ×${pendingChoice.mult} | Salah → ÷${pendingChoice.mult}
    </div>
    <div class="question-box">
      <div class="qtext">${escapeHtml(soal.q)}</div>
      <div id="qopts"></div>
      <div id="qresult"></div>
    </div>
  `;

  panel.innerHTML = html;

  const optsWrap = document.getElementById('qopts');

  if (soal.tipe === 'Sederhana') {
    renderSederhana(soal, optsWrap);
  } else if (soal.tipe === 'Kategori') {
    renderKategori(soal, optsWrap);
  } else if (soal.tipe === 'MCMA') {
    renderMcma(soal, optsWrap);
  }
}

/* ============================================================
   RENDER SEDERHANA
   ============================================================ */
function renderSederhana(soal, optsWrap) {
  soal.opts.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'qopt-wrapper';
    div.addEventListener('click', () => {
      const radio = div.querySelector('input[type="radio"]');
      radio.checked = true;
      radio.dispatchEvent(new Event('change'));
    });
    div.innerHTML = `
      <input type="radio" name="soal_sederhana" value="${idx}" id="qopt_${idx}">
      <label for="qopt_${idx}">${escapeHtml(optText)}</label>
    `;
    optsWrap.appendChild(div);
  });

  const radios = optsWrap.querySelectorAll('input[type="radio"]');
  radios.forEach(radio => {
    radio.addEventListener('change', function() {
      if (this.checked) {
        const idx = parseInt(this.value);
        const benar = idx === soal.a;
        jawabSederhana(benar, soal, optsWrap);
      }
    });
  });
}

/* ============================================================
   RENDER KATEGORI
   ============================================================ */
function renderKategori(soal, optsWrap) {
  const table = document.createElement('table');
  table.className = 'kategori-table';
  let tableHtml = `<thead><tr><th>Pernyataan</th>`;
  soal.kategori.forEach(kat => {
    tableHtml += `<th>${escapeHtml(kat)}</th>`;
  });
  tableHtml += `</tr></thead><tbody>`;

  const jawabanUser = {};

  soal.pernyataan.forEach((pernyataan, idx) => {
    tableHtml += `<tr>`;
    tableHtml += `<td class="pernyataan-cell">${escapeHtml(pernyataan)}</td>`;
    soal.kategori.forEach((kat, katIdx) => {
      const radioId = `kategori_${idx}_${katIdx}`;
      tableHtml += `<td class="kategori-cell">
        <input type="radio" name="kategori_${idx}" id="${radioId}" value="${katIdx}" 
               data-baris="${idx}" data-kategori="${katIdx}">
        <label for="${radioId}" class="kategori-label">✓</label>
      </td>`;
    });
    tableHtml += `</tr>`;
  });

  tableHtml += `</tbody>`;
  table.innerHTML = tableHtml;
  optsWrap.appendChild(table);

  const confirmArea = document.createElement('div');
  confirmArea.className = 'kategori-confirm-area';
  confirmArea.innerHTML = `
    <button class="btn kategori-confirm-btn" id="kategoriConfirmBtn">✅ Konfirmasi</button>
    <span class="kategori-hint">Isi semua, lalu konfirmasi</span>
  `;
  optsWrap.appendChild(confirmArea);

  const confirmBtn = document.getElementById('kategoriConfirmBtn');
  
  confirmBtn.addEventListener('click', function() {
    const radios = table.querySelectorAll('input[type="radio"]:checked');
    
    if (radios.length < soal.pernyataan.length) {
      const resultBox = document.getElementById('qresult');
      resultBox.innerHTML = `<div class="result-msg lose">⚠️ Jawab semua!</div>`;
      return;
    }

    const jawaban = {};
    radios.forEach(radio => {
      const baris = parseInt(radio.dataset.baris);
      const kat = parseInt(radio.dataset.kategori);
      jawaban[baris] = kat;
    });

    const benar = Array.from({length: soal.pernyataan.length}, (_, i) => i)
      .every(i => jawaban[i] === soal.a[i]);

    table.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
    confirmBtn.disabled = true;

    jawabKategori(benar, soal, optsWrap);
  });
}

/* ============================================================
   RENDER MCMA
   ============================================================ */
function renderMcma(soal, optsWrap) {
  const grid = document.createElement('div');
  grid.className = 'mcma-grid';

  soal.opts.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'mcma-item';
    const cbId = `mcma_${idx}`;
    div.innerHTML = `
      <input type="checkbox" id="${cbId}" value="${idx}" class="mcma-checkbox">
      <span class="mcma-huruf">${String.fromCharCode(65 + idx)}</span>
      <label for="${cbId}">${escapeHtml(optText)}</label>
    `;
    grid.appendChild(div);
  });

  const confirmArea = document.createElement('div');
  confirmArea.className = 'mcma-confirm-area';
  confirmArea.innerHTML = `
    <button class="btn mcma-confirm-btn" id="mcmaConfirmBtn">✅ Konfirmasi</button>
    <span class="mcma-hint">Pilih semua, lalu konfirmasi</span>
  `;

  optsWrap.appendChild(grid);
  optsWrap.appendChild(confirmArea);

  const confirmBtn = document.getElementById('mcmaConfirmBtn');
  confirmBtn.addEventListener('click', function() {
    const checked = grid.querySelectorAll('.mcma-checkbox:checked');
    const jawaban = Array.from(checked).map(cb => parseInt(cb.value));
    
    if (jawaban.length === 0) {
      const resultBox = document.getElementById('qresult');
      resultBox.innerHTML = `<div class="result-msg lose">⚠️ Pilih jawaban!</div>`;
      return;
    }

    const sortedJawaban = [...jawaban].sort();
    const sortedKunci = [...soal.a].sort();
    const benar = sortedJawaban.length === sortedKunci.length &&
                  sortedJawaban.every((v, i) => v === sortedKunci[i]);

    grid.querySelectorAll('.mcma-checkbox').forEach(cb => cb.disabled = true);
    this.disabled = true;

    jawabMcma(benar, soal, optsWrap);
  });
}

/* ============================================================
   FUNGSI JAWAB
   ============================================================ */

function jawabSederhana(benar, soal, optsWrap) {
  const p = players[currentPlayerIdx];
  const statLabel = pendingChoice.stat === 'energy' ? 'Energi' : 'Daya Serang';
  const mult = pendingChoice.mult;
  const resultBox = document.getElementById('qresult');

  optsWrap.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);

  optsWrap.querySelectorAll('.qopt-wrapper').forEach((el, i) => {
    if (i === soal.a) {
      el.style.borderColor = 'var(--mist-bright)';
      el.style.background = 'rgba(79,184,165,0.08)';
    } else if (!benar && i === parseInt(el.querySelector('input[type="radio"]:checked')?.value || -1)) {
      el.style.borderColor = 'var(--blood-bright)';
      el.style.background = 'rgba(138,35,51,0.08)';
    }
  });

  applyBoost(benar, p, statLabel, mult, resultBox);
}

function jawabKategori(benar, soal, optsWrap) {
  const p = players[currentPlayerIdx];
  const statLabel = pendingChoice.stat === 'energy' ? 'Energi' : 'Daya Serang';
  const mult = pendingChoice.mult;
  const resultBox = document.getElementById('qresult');

  const rows = optsWrap.querySelectorAll('tr');
  rows.forEach((row, idx) => {
    if (idx === 0) return;
    const cells = row.querySelectorAll('td.kategori-cell');
    cells.forEach((cell, katIdx) => {
      const radio = cell.querySelector('input[type="radio"]');
      if (radio) {
        if (katIdx === soal.a[idx - 1]) {
          cell.style.background = 'rgba(79,184,165,0.08)';
          cell.style.borderRadius = '3px';
        } else if (radio.checked && katIdx !== soal.a[idx - 1]) {
          cell.style.background = 'rgba(138,35,51,0.08)';
          cell.style.borderRadius = '3px';
        }
      }
    });
  });

  applyBoost(benar, p, statLabel, mult, resultBox);
}

function jawabMcma(benar, soal, optsWrap) {
  const p = players[currentPlayerIdx];
  const statLabel = pendingChoice.stat === 'energy' ? 'Energi' : 'Daya Serang';
  const mult = pendingChoice.mult;
  const resultBox = document.getElementById('qresult');

  const items = optsWrap.querySelectorAll('.mcma-item');
  items.forEach((item, idx) => {
    const cb = item.querySelector('.mcma-checkbox');
    if (soal.a.includes(idx)) {
      item.style.borderColor = 'var(--mist-bright)';
      item.style.background = 'rgba(79,184,165,0.06)';
    } else if (cb.checked && !soal.a.includes(idx)) {
      item.style.borderColor = 'var(--blood-bright)';
      item.style.background = 'rgba(138,35,51,0.08)';
    }
  });

  applyBoost(benar, p, statLabel, mult, resultBox);
}

function applyBoost(benar, p, statLabel, mult, resultBox) {
  if (benar) {
    if (pendingChoice.stat === 'energy') {
      p.energy = p.energy * mult;
    } else {
      p.attack = p.attack * mult;
    }
    resultBox.innerHTML = `<div class="result-msg win">✅ ${statLabel} ×${mult}!</div>`;
    log(`<b>${escapeHtml(p.name)}</b> benar! ${statLabel} ×${mult}`, 'boost');
  } else {
    if (pendingChoice.stat === 'energy') {
      p.energy = Math.max(1, Math.ceil(p.energy / mult));
    } else {
      p.attack = Math.max(1, Math.ceil(p.attack / mult));
    }
    resultBox.innerHTML = `<div class="result-msg lose">❌ ${statLabel} ÷${mult}</div>`;
    log(`<b>${escapeHtml(p.name)}</b> salah! ${statLabel} ÷${mult}`, 'fail');
  }

  renderPlayers();
  showNextButton(resultBox);
}

function showNextButton(resultBox) {
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.style.marginTop = '6px';
  btn.textContent = boostQueue.length > 0 ? '→ Pemain Berikutnya' : '→ Fase Serangan';
  btn.addEventListener('click', nextBoostTurn);
  resultBox.appendChild(btn);
}

/* ============================================================
   ATTACK PHASES
   ============================================================ */
function runPlayerAttackPhase(){
  setPhaseLabel('⚔ Serang!');
  const panel = document.getElementById('action-panel');
  panel.innerHTML = `<h3>Serangan Balasan</h3><div class="sub">Setiap pemain menyerang!</div><div id="attack-feed"></div>`;
  const feed = panel.querySelector('#attack-feed');

  const alive = players.filter(p=>p.alive);
  let i = 0;

  function step(){
    if(i >= alive.length || monster.energy <= 0){
      finishPlayerAttacks();
      return;
    }
    const p = alive[i];
    monster.energy -= p.attack;
    shakeMonster();
    renderMonster();
    const line = document.createElement('div');
    line.className = 'result-msg win';
    line.style.marginTop = '4px';
    line.textContent = `${p.name} ⚔ ${p.attack} → ${Math.max(0,monster.energy)}`;
    feed.appendChild(line);
    log(`<b>${escapeHtml(p.name)}</b> ⚔ -${p.attack}`, 'hit-monster');
    i++;
    setTimeout(step, 400);
  }
  step();
}

function finishPlayerAttacks(){
  const panel = document.getElementById('action-panel');
  if(monster.energy <= 0){
    endGame(true);
    return;
  }
  const contBtn = document.createElement('button');
  contBtn.className = 'btn blood';
  contBtn.style.marginTop = '6px';
  contBtn.textContent = '👹 Giliran Monster';
  contBtn.addEventListener('click', runMonsterAttackPhase);
  panel.querySelector('#attack-feed').appendChild(contBtn);
}

function runMonsterAttackPhase(){
  setPhaseLabel('👹 Monster Balas!');
  const panel = document.getElementById('action-panel');
  panel.innerHTML = `<h3>Balasan Monster</h3><div class="sub">Monster menyerang semua!</div><div id="monster-feed"></div>`;
  const feed = panel.querySelector('#monster-feed');

  const alive = players.filter(p=>p.alive);
  let i = 0;

  function step(){
    const stillAlive = players.filter(p=>p.alive);
    if(i >= alive.length || stillAlive.length === 0){
      finishMonsterAttacks();
      return;
    }
    const p = alive[i];
    if(p.alive){
      p.energy -= monster.attack;
      if(p.energy <= 0){
        p.energy = 0;
        p.alive = false;
      }
      renderPlayers();
      const line = document.createElement('div');
      line.className = 'result-msg lose';
      line.style.marginTop = '4px';
      line.textContent = p.alive
        ? `${p.name} ❤️ ${p.energy}`
        : `${p.name} 💀 gugur!`;
      feed.appendChild(line);
      log(`👹 → <b>${escapeHtml(p.name)}</b> ${p.alive ? '' : '💀'}`, 'hit-player');
    }
    i++;
    setTimeout(step, 400);
  }
  step();
}

function finishMonsterAttacks(){
  const panel = document.getElementById('action-panel');
  const anyAlive = players.some(p=>p.alive);
  if(!anyAlive){
    endGame(false);
    return;
  }
  const contBtn = document.createElement('button');
  contBtn.className = 'btn';
  contBtn.style.marginTop = '6px';
  contBtn.textContent = `🔄 Ronde ${round+1}`;
  contBtn.addEventListener('click', ()=>{
    monster.attack *= 2;
    renderMonster();
    log(`👹 Monster attack ↑ ${monster.attack}`, 'hit-player');
    round++;
    startRound();
  });
  panel.querySelector('#monster-feed').appendChild(contBtn);
}

/* ============================================================
   END GAME
   ============================================================ */
function endGame(playersWon){
  isGameActive = false;
  gameScreen.classList.add('hidden');
  endScreen.classList.remove('hidden');
  const icon = document.getElementById('end-icon');
  const title = document.getElementById('end-title');
  const desc = document.getElementById('end-desc');

  if(playersWon){
    icon.innerHTML = `<path d="M32 6 L38 18 L52 8 L48 24 L60 22 L48 34 Q60 40 58 52 Q54 60 32 60 Q10 60 6 52 Q4 40 16 34 L4 22 L16 24 L12 8 L26 18 Z" fill="#f0cf6e" stroke="#a8801f" stroke-width="2" stroke-linejoin="round"/>`;
    title.textContent = '🏆 MENANG!';
    title.style.color = 'var(--gold-bright)';
    desc.textContent = 'Raja Monster tumbang! Kemenangan gemilang!';
    log('👑 <b>MONSTER TUMBANG!</b>', 'boost');
  } else {
    icon.innerHTML = `<path d="M32 6 L42 20 L58 12 L54 32 Q62 40 58 54 Q52 60 32 60 Q12 60 6 54 Q2 40 10 32 L6 12 L22 20 Z" fill="#8a2333" stroke="#d64858" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="34" r="3" fill="#0c0714"/><circle cx="40" cy="34" r="3" fill="#0c0714"/>`;
    title.textContent = '💀 KALAH!';
    title.style.color = 'var(--blood-bright)';
    desc.textContent = 'Semua pemberani gugur. Monster masih berkuasa!';
    log('💀 <b>Semua gugur!</b>', 'fail');
  }
}

})();
