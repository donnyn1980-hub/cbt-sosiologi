<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 Froggy Jump — Kuis Sosiologi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1c3f5e, #08131f 70%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 18px 12px 40px;
    color: #eaf6ff;
  }

  .wrap { width: 100%; max-width: 900px; }

  header { text-align: center; margin-bottom: 12px; }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    letter-spacing: 1px;
    background: linear-gradient(90deg, #8ef5b6, #6fe0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(110, 240, 180, .25));
  }

  .sub {
    font-size: .85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #6fa8c4;
    margin-top: 4px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 10px 16px;
    margin-bottom: 12px;
    font-weight: 700;
    font-size: .95rem;
    backdrop-filter: blur(6px);
  }

  .hud div { display: flex; align-items: center; gap: 6px; }

  .stage {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 2px rgba(120,240,200,.15);
    line-height: 0;
    transition: transform .08s;
  }

  .stage.shake { animation: shake .4s; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px) rotate(-.6deg); }
    40% { transform: translateX(9px) rotate(.6deg); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  canvas { width: 100%; height: auto; display: block; }

  /* ---------- QUIZ PANEL ---------- */
  .quiz {
    margin-top: 14px;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 18px;
    padding: 16px 18px 18px;
    backdrop-filter: blur(8px);
    transition: opacity .25s;
  }

  .qnum {
    font-size: .72rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #6fe0ff;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .qtext {
    font-size: clamp(.95rem, 2.3vw, 1.12rem);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 14px;
    color: #f2fbff;
  }

  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  @media (max-width: 620px) { .opts { grid-template-columns: 1fr; } }

  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid rgba(120, 220, 255, .22);
    background: rgba(255,255,255,.05);
    color: #dff4ff;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 500;
    line-height: 1.35;
    cursor: pointer;
    transition: all .18s ease;
  }

  .opt:hover:not(.disabled) {
    background: rgba(110, 224, 255, .16);
    border-color: #6fe0ff;
    transform: translateY(-2px);
  }

  .opt .key {
    flex: 0 0 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: rgba(111,224,255,.16);
    color: #6fe0ff;
    font-weight: 800;
    font-size: .8rem;
  }

  .opt.correct {
    background: rgba(80, 240, 150, .22);
    border-color: #4dfb9a;
    color: #d6ffe9;
  }
  .opt.correct .key { background: #4dfb9a; color: #06301c; }

  .opt.wrong {
    background: rgba(255, 80, 110, .2);
    border-color: #ff5470;
    color: #ffd9e0;
  }
  .opt.wrong .key { background: #ff5470; color: #33000a; }

  .opt.disabled { cursor: default; opacity: .85; }

  /* ---------- OVERLAY ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    gap: 10px;
    padding: 24px;
    background: rgba(4, 16, 26, .82);
    backdrop-filter: blur(5px);
    line-height: 1.5;
    z-index: 5;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    font-size: clamp(1.5rem, 5vw, 2.3rem);
    background: linear-gradient(90deg, #8ef5b6, #6fe0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .overlay p { color: #a9c8da; font-size: .95rem; max-width: 420px; }

  .overlay button {
    margin-top: 10px;
    padding: 13px 34px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: .5px;
    color: #04231a;
    background: linear-gradient(135deg, #8ef5b6, #4fd6ff);
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(80, 230, 190, .35);
    transition: transform .15s, box-shadow .15s;
  }

  .overlay button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 14px 32px rgba(80, 230, 190, .5);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🐸 Froggy Jump</h1>
    <p class="sub">Kuis Sosiologi</p>
  </header>

  <div class="hud">
    <div>❤️ Nyawa: <span id="lives">3</span></div>
    <div>⭐ Skor: <span id="score">0</span></div>
    <div>🍃 Daun: <span id="prog">1 / 8</span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="900" height="640"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="ovTitle">Selamat!</h2>
      <p id="ovText"></p>
      <button id="ovBtn">Main Lagi 🔁</button>
    </div>
  </div>

  <div class="quiz" id="quiz">
    <div class="qnum" id="qnum">Soal 1</div>
    <div class="qtext" id="qtext">Memuat soal…</div>
    <div class="opts" id="opts"></div>
  </div>

</div>

<script>
/* =========================================================
   BANK SOAL SOSIOLOGI
   ========================================================= */
const QUESTIONS = [
  {
    q: "Apa yang dimaksud dengan interaksi sosial?",
    o: [
      "Hubungan timbal balik yang saling memengaruhi antarindividu atau kelompok",
      "Kegiatan individu untuk memenuhi kebutuhan pribadi semata",
      "Proses perubahan kebudayaan secara cepat dan menyeluruh",
      "Perpindahan penduduk dari satu daerah ke daerah lain"
    ],
    a: 0
  },
  {
    q: "Tokoh yang dikenal sebagai Bapak Sosiologi adalah…",
    o: ["Karl Marx", "Auguste Comte", "Emile Durkheim", "Max Weber"],
    a: 1
  },
  {
    q: "Proses seseorang mempelajari dan menghayati norma serta nilai masyarakat disebut…",
    o: ["Akulturasi", "Asimilasi", "Sosialisasi", "Akomodasi"],
    a: 2
  },
  {
    q: "Lembaga sosial yang berfungsi mengatur perkawinan dan reproduksi adalah…",
    o: ["Keluarga", "Agama", "Politik", "Pendidikan"],
    a: 0
  },
  {
    q: "Norma yang memiliki sanksi paling tegas dan bersifat tertulis adalah…",
    o: ["Adat", "Kesopanan", "Kesusilaan", "Hukum"],
    a: 3
  },
  {
    q: "Menurut Lewis Coser, konflik sosial dapat berfungsi sebagai…",
    o: [
      "Sarana memperkuat solidaritas kelompok",
      "Penghambat seluruh perubahan sosial",
      "Penyebab utama kemiskinan struktural",
      "Tanda kehancuran suatu masyarakat"
    ],
    a: 0
  },
  {
    q: "Perpindahan status sosial seseorang dari rendah ke tinggi disebut mobilitas sosial…",
    o: ["Horizontal", "Vertikal naik (social climbing)", "Vertikal turun", "Antargenerasi"],
    a: 1
  },
  {
    q: "Pendekatan yang memandang masyarakat sebagai sistem yang saling berkaitan adalah…",
    o: ["Teori konflik", "Interaksionisme simbolik", "Fungsionalisme struktural", "Teori pertukaran"],
    a: 2
  },
  {
    q: "Ciri utama kelompok primer adalah…",
    o: [
      "Hubungan intim, personal, dan tatap muka",
      "Hubungan formal dan berdasarkan kontrak",
      "Jumlah anggota besar serta tidak personal",
      "Adanya pembagian kerja yang rumit"
    ],
    a: 0
  },
  {
    q: "Kebudayaan yang bersifat abstrak dan menjadi pedoman hidup masyarakat disebut…",
    o: ["Artefak", "Nilai", "Teknologi", "Bahasa"],
    a: 1
  },
  {
    q: "Percampuran dua kebudayaan yang menghasilkan kebudayaan baru tanpa menghilangkan ciri khas masing-masing disebut…",
    o: ["Asimilasi", "Difusi", "Amalgamasi", "Akulturasi"],
    a: 3
  },
  {
    q: "Kelompok sosial yang terbentuk karena adanya ikatan darah disebut kelompok…",
    o: ["Kekerabatan (genealogis)", "Kepentingan", "Politik", "Okupasional"],
    a: 0
  },
  {
    q: "Contoh lembaga sosial yang berperan dalam pengendalian sosial adalah…",
    o: ["Bank", "Pasar", "Kepolisian", "Perusahaan"],
    a: 2
  },
  {
    q: "Teori yang menekankan peran simbol dan makna dalam interaksi sosial adalah…",
    o: ["Fungsionalisme", "Interaksionisme simbolik", "Teori konflik", "Determinisme"],
    a: 1
  },
  {
    q: "Masyarakat majemuk di Indonesia ditandai oleh…",
    o: [
      "Keberagaman suku, agama, dan budaya",
      "Kesamaan bahasa daerah di seluruh wilayah",
      "Homogenitas budaya yang tinggi",
      "Tidak adanya perbedaan antar kelompok"
    ],
    a: 0
  },
  {
    q: "Keadaan tanpa norma yang mengatur perilaku masyarakat sehingga terjadi kekacauan disebut…",
    o: ["Anomi", "Konformitas", "Akomodasi", "Integrasi"],
    a: 0
  }
];

/* =========================================================
   SETUP KANVAS & PIPA (LILY PAD)
   ========================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const pads = [
  { x: 170, y: 578 },
  { x: 450, y: 505 },
  { x: 730, y: 432 },
  { x: 450, y: 359 },
  { x: 170, y: 286 },
  { x: 450, y: 213 },
  { x: 730, y: 140 },
  { x: 450, y:  70 }
];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  padIndex: 0,
  frog: { x: pads[0].x, y: pads[0].y - 14 },
  jumping: false,
  lives: 3,
  score: 0,
  over: false,
  locked: false
};

let jumpAnim = null;
let pool = [];
let currentQ = null;
let answeredCount = 0;

/* =========================================================
   AUDIO SEDERHANA
   ========================================================= */
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.06) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* abaikan */ }
}

/* =========================================================
   UTIL
   ========================================================= */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =========================================================
   MENGGAMBAR
   ========================================================= */
function drawWater(ts) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#8fe6d3');
  g.addColorStop(0.42, '#37a88e');
  g.addColorStop(1,   '#0b4038');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // riak air
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  for (let i = 0; i < 7; i++) {
    const ph = ((ts / 3200) + i / 7) % 1;
    const cx = 90 + i * 125;
    const cy = 90 + (i % 3) * 190;
    ctx.globalAlpha = (1 - ph) * 0.55;
    ctx.beginPath();
    ctx.arc(cx, cy, 8 + ph * 58, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // gelembung
  ctx.save();
  for (let i = 0; i < 16; i++) {
    const seed = i * 137.5;
    const bx = (seed * 7) % W;
    const speed = 0.012 + (i % 5) * 0.004;
    const by = H - ((ts * speed + seed * 3) % (H + 60));
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#d9fff6';
    ctx.beginPath();
    ctx.arc(bx, by, 2 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPad(p, isActive, isGoal) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // bayangan
  ctx.fillStyle = 'rgba(0,20,15,0.22)';
  ctx.beginPath();
  ctx.ellipse(0, 7, 58, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // daun
  const g = ctx.createRadialGradient(-16, -9, 4, 0, 0, 62);
  if (isGoal) {
    g.addColorStop(0, '#b6ffb0');
    g.addColorStop(1, '#2f9c46');
  } else if (isActive) {
    g.addColorStop(0, '#8df06a');
    g.addColorStop(1, '#3a9231');
  } else {
    g.addColorStop(0, '#63b95c');
    g.addColorStop(1, '#276b28');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 58, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  // tepi
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 58, 24, 0, 0, Math.PI * 2);
  ctx.stroke();

  // urat daun
  ctx.strokeStyle = 'rgba(20,70,25,0.4)';
  ctx.lineWidth = 1.6;
  for (let a = 0; a < 6; a++) {
    const ang = (a / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(ang) * 48, Math.sin(ang) * 19);
    ctx.stroke();
  }

  // tanda tujuan
  if (isGoal) {
    ctx.font = '26px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏁', 0, -46);
  }

  ctx.restore();
}

function drawFrog(x, y, scaleY = 1, scaleX = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scaleX, scaleY);

  // kaki belakang
  ctx.fillStyle = '#3a8c33';
  ctx.beginPath(); ctx.ellipse(-23, 13, 13, 8, -0.32, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 23, 13, 13, 8,  0.32, 0, Math.PI * 2); ctx.fill();

  // badan
  const bg = ctx.createLinearGradient(0, -28, 0, 28);
  bg.addColorStop(0, '#8cf268');
  bg.addColorStop(1, '#3a8c33');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 25, 0, 0, Math.PI * 2); ctx.fill();

  // perut
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath(); ctx.ellipse(0, 9, 18, 12, 0, 0, Math.PI * 2); ctx.fill();

  // mata
  ctx.fillStyle = '#8cf268';
  ctx.beginPath(); ctx.arc(-13, -21, 11, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 13, -21, 11, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-13, -21, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 13, -21, 7.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#0d1c14';
  ctx.beginPath(); ctx.arc(-13, -20, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 13, -20, 4, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-14.5, -21.5, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 11.5, -21.5, 1.6, 0, Math.PI * 2); ctx.fill();

  // mulut
  ctx.strokeStyle = '#2b6b24';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, -3, 10, 0.18 * Math.PI, 0.82 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function render(ts) {
  drawWater(ts);

  for (let i = 0; i < pads.length; i++) {
    drawPad(pads[i], i === state.padIndex, i === pads.length - 1);
  }

  // bayangan katak saat melompat
  if (state.jumping) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#001a12';
    ctx.beginPath();
    ctx.ellipse(state.frog.x, state.frog.y + 34, 24, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawFrog(state.frog.x, state.frog.y, 1, 1);
}

/* =========================================================
   LOGIKA LONCAT
   ========================================================= */
function startJump(fromIdx, toIdx) {
  const from = pads[fromIdx];
  const to = pads[toIdx];
  jumpAnim = {
    t: 0,
    dur: 520,
    from: { x: from.x, y: from.y - 14 },
    to:   { x: to.x,   y: to.y - 14 }
  };
  state.jumping = true;
  beep(520, 0.1, 'sine', 0.05);
}

function update(dt) {
  if (!jumpAnim) return;

  jumpAnim.t += dt / jumpAnim.dur;

  if (jumpAnim.t >= 1) {
    jumpAnim.t = 1;
    state.frog.x = jumpAnim.to.x;
    state.frog.y = jumpAnim.to.y;
    state.padIndex++;
    jumpAnim = null;
    state.jumping = false;
    updateHUD();

    if (state.padIndex >= pads.length - 1) {
      endGame(true);
    } else {
      nextQuestion();
    }
    return;
  }

  const t = jumpAnim.t;
  const ease = t; // linear horizontal
  state.frog.x = jumpAnim.from.x + (jumpAnim.to.x - jumpAnim.from.x) * ease;
  state.frog.y = jumpAnim.from.y + (jumpAnim.to.y - jumpAnim.from.y) * ease
                 - Math.sin(Math.PI * t) * 72;
}

/* =========================================================
   LOOP
   ========================================================= */
let lastTs = 0;
function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(60, ts - lastTs);
  lastTs = ts;

  update(dt);
  render(ts);
  requestAnimationFrame(loop);
}

/* =========================================================
   KUIS
   ========================================================= */
const qnumEl  = document.getElementById('qnum');
const qtextEl = document.getElementById('qtext');
const optsEl  = document.getElementById('opts');
const livesEl = document.getElementById('lives');
const scoreEl = document.getElementById('score');
const progEl  = document.getElementById('prog');

function updateHUD() {
  livesEl.textContent = state.lives;
  scoreEl.textContent = state.score;
  progEl.textContent = Math.min(state.padIndex + 1, pads.length) + ' / ' + pads.length;
}

function nextQuestion() {
  state.locked = false;
  answeredCount++;

  if (pool.length === 0) pool = shuffle([...QUESTIONS]);
  const raw = pool.pop();

  // acak opsi
  const order = raw.o.map((_, i) => i);
  shuffle(order);
  currentQ = {
    q: raw.q,
    o: order.map(i => raw.o[i]),
    a: order.indexOf(raw.a)
  };

  qnumEl.textContent = 'Soal ' + answeredCount;
  qtextEl.textContent = currentQ.q;
  optsEl.innerHTML = '';

  const keys = ['A', 'B', 'C', 'D'];
  currentQ.o.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="key">' + keys[i] + '</span><span>' + text + '</span>';
    btn.addEventListener('click', () => answer(i));
    optsEl.appendChild(btn);
  });
}

function answer(idx) {
  if (state.locked || state.over) return;
  state.locked = true;

  const btns = [...optsEl.children];
  btns.forEach(b => b.classList.add('disabled'));
  btns[currentQ.a].classList.add('correct');

  if (idx === currentQ.a) {
    // BENAR
    beep(880, 0.1, 'sine', 0.07);
    setTimeout(() => beep(1320, 0.14, 'sine', 0.06), 90);
    state.score++;
    updateHUD();

    setTimeout(() => {
      startJump(state.padIndex, state.padIndex + 1);
    }, 420);
  } else {
    // SALAH
    btns[idx].classList.add('wrong');
    beep(180, 0.28, 'sawtooth', 0.06);
    state.lives--;
    updateHUD();

    const stage = document.getElementById('stage');
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');

    if (state.lives <= 0) {
      setTimeout(() => endGame(false), 900);
    } else {
      setTimeout(() => nextQuestion(), 1500);
    }
  }
}

/* =========================================================
   AKHIR PERMAINAN
   ========================================================= */
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText  = document.getElementById('ovText');
const ovBtn   = document.getElementById('ovBtn');

function endGame(win) {
  state.over = true;
  state.locked = true;

  if (win) {
    ovTitle.textContent = '🏆 Kamu Sampai Puncak!';
    ovText.textContent = 'Katak berhasil mencapai daun terakhir. Skor akhir: '
      + state.score + ' jawaban benar. Kamu makin paham Sosiologi!';
    beep(660, 0.12); setTimeout(() => beep(880, 0.12), 130);
    setTimeout(() => beep(1180, 0.25), 260);
  } else {
    ovTitle.textContent = '💧 Katak Tercebur…';
    ovText.textContent = 'Nyawa habis. Skor akhir: ' + state.score
      + ' jawaban benar. Ayo coba lagi dan pelajari materinya!';
    beep(300, 0.2, 'sawtooth'); setTimeout(() => beep(180, 0.35, 'sawtooth'), 180);
  }

  overlay.classList.remove('hidden');
}

function resetGame() {
  state.padIndex = 0;
  state.frog = { x: pads[0].x, y: pads[0].y - 14 };
  state.jumping = false;
  state.lives = 3;
  state.score = 0;
  state.over = false;
  state.locked = false;
  jumpAnim = null;
  pool = shuffle([...QUESTIONS]);
  answeredCount = 0;

  overlay.classList.add('hidden');
  updateHUD();
  nextQuestion();
}

ovBtn.addEventListener('click', resetGame);

/* =========================================================
   MULAI
   ========================================================= */
updateHUD();
nextQuestion();
requestAnimationFrame(loop);
</script>
</body>
